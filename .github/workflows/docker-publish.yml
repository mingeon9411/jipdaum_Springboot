name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mingeon9411
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mingeon9411/jipdaum:latest
            mingeon9411/jipdaum:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull mingeon9411/jipdaum:latest
            docker stop jipdaum-spring || true
            docker rm jipdaum-spring || true
            docker run -d --name jipdaum-spring \
              --network jipdaum-net \
              -p 127.0.0.1:8081:8081 \
              -v /opt/jipdaum/config/application.yml:/app/config/application.yml:ro \
              -e EMAIL_HOST_USER='${{ secrets.EMAIL_HOST_USER }}' \
              -e EMAIL_HOST_PASSWORD='${{ secrets.EMAIL_HOST_PASSWORD }}' \
              -e EMAIL_FROM_ADDRESS='${{ secrets.EMAIL_FROM_ADDRESS }}' \
              --restart unless-stopped \
              mingeon9411/jipdaum:latest
            docker image prune -f